# Manual snapshot for the helper's own GitHub Copilot SDK loop.
# Leave TargetAgentName empty in deploy.config.psd1 to maintain this yourself.
# Copy to target-agent.yaml, replace placeholders, then deploy the helper.
# A local snapshot takes precedence over TARGET_AGENT_ID startup lookup.

name: My Target Agent

# Optional: overrides AZURE_AI_MODEL_DEPLOYMENT_NAME when set.
model: <existing-model-deployment-name>

# The target agent's system prompt / persona.
instructions: |
  You are the Contoso assistant. Answer questions about <your domain> and
  help users with <your tasks>. Be concise and cite numbers from tool results.

# Use tools: [] if no toolbox is needed. Credentials live in project connections,
# not here. The consumer URL follows published default, not newest-created.
# Tool approval is not bypassed; this bridge currently requires never.
tools:
  - type: mcp
    server_label: <toolbox-name>
    server_url: https://<account>.services.ai.azure.com/api/projects/<project>/toolboxes/<toolbox-name>/mcp?api-version=v1
    project_connection_id: <toolbox-connection-alias>
    require_approval: never

# The source target is not invoked. Host file/Python tools handle uploaded files
# and generated documents; remote toolbox built-ins can use a separate sandbox.
# Other tool declarations are not executable without an implementation here.
