# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: 'align-tech-public-activity-agent-BYO-AP'
services:
    'align-tech-public-activity-agent-BYO-AP':
        project: 'src/activity-agent-2'
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME='gpt-5.2'}
        agentEndpoint:
            authorizationSchemes:
                - type: BotServiceRbac
            protocols:
                - activity
        codeConfiguration:
            entryPoint: 'main.py'
            runtime: 'python_3_13'
        container:
            resources:
                cpu: '1'
                memory: '2Gi'
        description: 'A personal assistant on the Activity protocol, powered by the GitHub Copilot SDK and published to Microsoft Teams.'
        displayName: 'align-tech-public-activity-agent-BYO-AP'
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Activity Protocol
                - Bring Your Own
                - GitHub Copilot SDK
                - Python
        name: 'align-tech-public-activity-agent-BYO-AP'
        protocols:
            - protocol: activity
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments: []
        endpoint: 'https://<foundry-resource-name>.services.ai.azure.com/api/projects/<foundry-project-name>'
infra:
    provider: microsoft.foundry
