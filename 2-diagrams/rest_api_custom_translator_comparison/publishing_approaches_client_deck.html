<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Foundry to Teams - Client Walkthrough</title>
  <script>
    (() => {
      const theme = new URLSearchParams(window.location.search).get("clawpilotTheme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root { color-scheme:light; --cp-bg:#f7f4ef; --cp-surface:#ffffff; --cp-border:#dedede; --cp-border-strong:#919191; --cp-text:#242424; --cp-text-muted:#5c5c5c; --cp-text-soft:#6f6f6f; --cp-accent:#5c2d91; }
    html[data-theme="dark"] { color-scheme:dark; --cp-bg:#3d3b3a; --cp-surface:#292929; --cp-border:#474747; --cp-border-strong:#5f5f5f; --cp-text:#dedede; --cp-text-muted:#b0b0b0; --cp-text-soft:#919191; --cp-accent:#c8a8e5; }
    * { box-sizing:border-box; } body { margin:0; overflow:hidden; background:var(--cp-bg); color:var(--cp-text); font-family:"Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif; }
    .deck { height:100vh; display:grid; grid-template-rows:64px 1fr 64px; }
    header,footer { display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:var(--cp-surface); }
    header { border-bottom:1px solid var(--cp-border); } footer { border-top:1px solid var(--cp-border); }
    .title { font-size:15px; font-weight:700; } .caption,.counter { color:var(--cp-text-muted); font-size:13px; }
    .stage { position:relative; overflow:hidden; } iframe { width:100%; height:100%; border:0; background:var(--cp-bg); }
    .nav { display:flex; align-items:center; gap:9px; } button { width:34px; height:34px; border:1px solid var(--cp-border); border-radius:8px; background:var(--cp-surface); color:var(--cp-text); cursor:pointer; font-size:19px; } button:hover { border-color:var(--cp-accent); color:var(--cp-accent); } button:disabled { opacity:.4; cursor:not-allowed; }
    .dots { display:flex; gap:7px; } .dot { width:8px; height:8px; border:0; border-radius:50%; background:var(--cp-border-strong); padding:0; } .dot.active { width:22px; border-radius:8px; background:var(--cp-accent); }
    .hint { color:var(--cp-text-soft); font-size:12px; }
    @media (max-width:650px) { .deck { grid-template-rows:54px 1fr 54px; } header,footer { padding:0 12px; } .caption,.hint { display:none; } }
  </style>
</head>
<body>
  <main class="deck">
    <header><div><span class="title">Private Foundry to Teams</span><span class="caption" id="caption"></span></div><span class="counter" id="counter"></span></header>
    <section class="stage"><iframe id="slide" title="Client walkthrough slide"></iframe></section>
    <footer><span class="hint">Use left and right arrow keys to navigate</span><div class="dots" id="dots" aria-label="Slide navigation"></div><div class="nav"><button id="previous" aria-label="Previous slide">&#8249;</button><button id="next" aria-label="Next slide">&#8250;</button></div></footer>
  </main>
  <script>
    const slides = [
      { title: "High-level choice", file: "publishing_approaches_high_level.html" },
      { title: "Comparison at a glance", file: "publishing_approaches_at_a_glance.html" },
      { title: "Native REST publish", file: "rest_api_publish_flow_private_foundry.html" },
      { title: "Native REST test results", file: "rest_api_test_summary.html" },
      { title: "Custom Teams bridge", file: "streamlit_publisher_flow_shared_container.html" }
    ];
    const slide = document.getElementById("slide");
    const caption = document.getElementById("caption");
    const counter = document.getElementById("counter");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const dots = document.getElementById("dots");
    let current = 0;
    const theme = document.documentElement.dataset.theme;
    function show(index) {
      current = Math.max(0, Math.min(index, slides.length - 1));
      const item = slides[current];
      slide.src = `${item.file}?clawpilotTheme=${theme}`;
      caption.textContent = ` - ${item.title}`;
      counter.textContent = `${current + 1} / ${slides.length}`;
      previous.disabled = current === 0;
      next.disabled = current === slides.length - 1;
      [...dots.children].forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === current));
    }
    slides.forEach((item, index) => {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.setAttribute("aria-label", `Go to ${item.title}`);
      dot.addEventListener("click", () => show(index));
      dots.appendChild(dot);
    });
    previous.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    function handleNavigation(event) {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight" || event.key === " ") { event.preventDefault(); show(current + 1); }
    }
    document.addEventListener("keydown", handleNavigation);
    slide.addEventListener("load", () => slide.contentDocument?.addEventListener("keydown", handleNavigation));
    show(0);
  </script>
</body>
</html>
